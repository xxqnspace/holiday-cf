<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icons/icon-96.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>管理面板 - 登录</title>
    <!-- Open Graph 协议：微信等社交平台分享图文卡片
         部署后请把下面 og:image / og:url 换成你的实际域名（OG 要求绝对地址） -->
    <meta property="og:title" content="管理面板 - 登录">
    <meta property="og:description" content="学期倒计时后台登录入口，登录后可配置学期起止日期、节假日与调休安排。">
    <meta property="og:image" content="/icons/icon-512.png">
    <meta property="og:url" content="/login.html">
    <meta property="og:type" content="website">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 380px;
            max-width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .login-card h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 1.5rem; }
        .login-card .subtitle { text-align: center; color: #999; margin-bottom: 28px; font-size: 0.9rem; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: #555; margin-bottom: 6px; font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 12px 14px;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 0.95rem; transition: border-color 0.2s;
            outline: none;
        }
        .form-group input:focus { border-color: #5c6bc0; box-shadow: 0 0 0 3px rgba(92,107,192,0.1); }
        .btn-login {
            width: 100%; padding: 12px;
            background: #5c6bc0; color: #fff; border: none;
            border-radius: 8px; font-size: 1rem; cursor: pointer;
            transition: background 0.2s; font-weight: 500;
        }
        .btn-login:hover { background: #4a55b0; }
        .btn-login:disabled { opacity: 0.65; cursor: default; }
        .error { background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; text-align: center; }
        .back-link { text-align: center; margin-top: 16px; }
        .back-link a { color: #5c6bc0; text-decoration: none; font-size: 0.9rem; }

        /* 移动端：输入框字号≥16px，避免 iOS 聚焦自动放大页面 */
        @media (max-width: 768px) {
            .form-group input { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="login-card">
    <h1><i class="fa-solid fa-lock"></i> 管理面板</h1>
    <p class="subtitle">学期倒计时系统</p>
    <div class="error" id="login-error" style="display:none;"></div>
    <form id="login-form">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="login-username" placeholder="请输入用户名" required autofocus>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="login-password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn-login" id="login-btn">登 录</button>
    </form>
    <div class="back-link"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> 返回首页</a></div>
</div>
<script>
    function getCookie(name) {
        const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : '';
    }

    // 进入页面先问一次登录态：已登录直接跳后台，顺带让服务端下发 CSRF cookie
    (async function checkAuth() {
        try {
            const resp = await fetch('/api/session');
            const json = await resp.json();
            if (json.success && json.data && json.data.logged_in) {
                location.replace('admin.html');
            }
        } catch (e) {
            // 接口不可用时停留在登录页
        }
    })();

    document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const btn = document.getElementById('login-btn');
        const errBox = document.getElementById('login-error');
        errBox.style.display = 'none';
        btn.disabled = true;
        btn.textContent = '登录中...';

        try {
            // 极端情况下（首个请求失败）cookie 可能还不存在，补发一次
            let csrf = getCookie('holiday_csrf');
            if (!csrf) {
                await fetch('/api/session');
                csrf = getCookie('holiday_csrf');
            }

            const resp = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrf,
                },
                body: JSON.stringify({
                    username: document.getElementById('login-username').value.trim(),
                    password: document.getElementById('login-password').value,
                }),
            });
            const json = await resp.json();

            if (json.success) {
                location.replace('admin.html');
                return;
            }

            errBox.textContent = json.message || '登录失败';
            errBox.style.display = '';
        } catch (err) {
            errBox.textContent = '网络错误，请稍后重试';
            errBox.style.display = '';
        }

        btn.disabled = false;
        btn.textContent = '登 录';
    });
</script>
</body>
</html>
