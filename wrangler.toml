name = "holiday"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-13"

# ============================================================
# 两种部署方式，按需选一种
# ============================================================
#
# 【方式一】Cloudflare 控制台 + Git 集成  —— 全程不需要命令行
#   当前文件保持原样即可，静态输出目录由上面的 pages_build_output_dir 指定。
#   D1 绑定和环境变量都在控制台里配置，步骤见 README「部署步骤」。
#
# 【方式二】Wrangler 命令行
#   把下面两块取消注释并填入真实的 database_id（npx wrangler d1 create holiday 会输出），
#   之后 npx wrangler pages deploy 即可一次性完成绑定与部署。
#
# [[d1_databases]]
# binding = "DB"                                         # 代码里就是 env.DB
# database_name = "holiday"
# database_id = "00000000-0000-0000-0000-000000000000"   # 换成生产库 ID
# preview_database_id = "00000000-0000-0000-0000-000000000000"  # 换成预览库 ID
# migrations_dir = "migrations"
#
# [vars]
# PBKDF2_ITERATIONS = "3000"   # 不设置时代码内置默认值也是 3000
# SESSION_DAYS = "30"          # 不设置时默认 30 天
